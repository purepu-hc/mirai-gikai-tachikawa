name: Source PDF Watch

# 市のPDF（登録データの原典）が差し替えられていないか、週1回確認する。
# 前回の取得結果（アーティファクト）と比べ、差し替え・取得不可があれば Issue を作る。
on:
  schedule:
    # 毎週月曜 7:17（日本時間）
    - cron: "17 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: source-pdf-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @mirai-gikai/tachikawa-ingest...

      - name: Download previous result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow source_pdf_watch.yml \
            --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name source-pdf-manifest --dir prev || true
          fi
          ls prev

      - name: Fetch PDFs and compare
        id: watch
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm --filter @mirai-gikai/tachikawa-ingest watch-sources -- --out-dir "$GITHUB_WORKSPACE/out" --prev "$GITHUB_WORKSPACE/prev/manifest.json"

      - name: Save result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-pdf-manifest
          path: out/manifest.json
          retention-days: 90

      - name: Create issue
        if: steps.watch.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "市のPDFに変化がありました（$(TZ=Asia/Tokyo date +%Y-%m-%d)）" \
            --body-file out/issue.md
